<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Habbo Dungeons — Tactical Dungeon Crawler for Habbo Origins</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/habbo-ui.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- run progress header (shown during a run) -->
  <div id="runHeader" class="hidden"></div>

  <!-- battle side panel (shown during battles) -->
  <div id="panel" class="hidden">
    <div id="banner" class="banner"></div>
    <div id="actions"></div>
    <div id="roster"></div>
    <div id="log"></div>
    <p class="info dim">Tap your unit → blue to move, red to attack, green to use a skill.</p>
  </div>

  <!-- explore testbed bar -->
  <div id="exploreBar" class="hidden">
    <button data-room="0">The Poisoned Toad</button>
    <button data-room="1">Town Square</button>
    <button data-room="2">Fogwood Forest</button>
    <button id="editRoom" class="hidden">Edit Room</button>
    <button id="saveRoom" class="hidden">Save Layout</button>
    <button id="exploreMenu">← Menu</button>
    <span id="exploreStatus" class="info dim"></span>
  </div>

  <!-- title / squad builder / run screens -->
  <div id="overlay"></div>

  <!-- crispify: snaps glyph alpha to 0/1 so the Volter pixel font never
       anti-aliases (the classic Habbo-font rendering trick) -->
  <svg width="0" height="0" xmlns="http://www.w3.org/2000/svg" style="position:absolute">
    <defs>
      <filter id="crispify">
        <feComponentTransfer>
          <feFuncA type="discrete" tableValues="0 1" />
        </feComponentTransfer>
      </filter>
    </defs>
  </svg>

  <script type="module" src="js/main.js"></script>
</body>
</html>
