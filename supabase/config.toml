[realtime]
enabled = true

[auth]
enabled = true
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = false

# --- V2 Edge Functions -------------------------------------------------------
# verify_jwt = false only for endpoints reachable by not-yet-signed-in clients
# (verify-habbo-link, sync-habbo-skills, fetch-habbo-profile, habbo-imaging)
# or invoked by cron with the service-role key (presence-reap).
[functions.verify-habbo-link]
verify_jwt = false
[functions.sync-habbo-skills]
verify_jwt = false
[functions.fetch-habbo-profile]
verify_jwt = false
[functions.habbo-imaging]
verify_jwt = false
[functions.stash-bank]
verify_jwt = true
[functions.save-room-layout]
verify_jwt = true
[functions.presence-heartbeat]
verify_jwt = true
[functions.presence-reap]
verify_jwt = false
[functions.party-invite]
verify_jwt = true
[functions.party-accept]
verify_jwt = true
[functions.party-decline]
verify_jwt = true
[functions.party-leave]
verify_jwt = true
[functions.party-disband]
verify_jwt = true
[functions.trade-open]
verify_jwt = true
[functions.trade-offer]
verify_jwt = true
[functions.trade-retract]
verify_jwt = true
[functions.trade-accept]
verify_jwt = true
[functions.trade-confirm]
verify_jwt = true
[functions.trade-cancel]
verify_jwt = true
# --- duels. All four resolve the caller with requireUser() and answer their own
# 401 "sign in first", so verify_jwt = true is both correct and the platform
# default. Declared anyway: every other function here states its value, and an
# undeclared function is one whose gate is whatever the dashboard last decided
# rather than what the repo says.
[functions.duel-challenge]
verify_jwt = true
[functions.duel-accept]
verify_jwt = true
[functions.duel-decline]
verify_jwt = true
[functions.duel-cancel]
verify_jwt = true
# Ending a fight. Both find the duel from the CALLER'S OWN user id, which is
# what makes them unspoofable — there is no duel id in either request.
[functions.duel-forfeit]
verify_jwt = true
[functions.duel-claim]
verify_jwt = true